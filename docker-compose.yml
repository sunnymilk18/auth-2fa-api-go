# Local dev stack for auth-2fa-api: the API plus everything it needs to run
# fully offline (Postgres, Redis), plus metrics + logs (OTel Collector ->
# Prometheus / Loki -> Grafana) so you can watch it while you use it.
#
# No mail server here on purpose: Resend is an HTTP API to Resend's own
# cloud (https://resend.com), not something you self-host — there's no
# "run Resend locally" container, and internal/mailer/resend.go always
# talks to the real api.resend.com. A fake local SMTP/catch-all server
# (Mailpit, MailHog, etc.) wouldn't actually be exercised by this code
# without changing it. So: just supply a real RESEND_API_KEY below (the
# free sandbox key from .env already works — it's an outbound HTTPS call,
# same from inside a container as from your host) and codes really arrive
# by email, same as running the API without Docker.
#
# Metrics + logs for now, no traces yet — see internal/telemetry (both
# SetupMetrics and SetupLogging) and internal/middleware/metrics.go for
# what the API actually sends. Logs always still go to stdout too
# (unconditionally) — this is additive, not a replacement for
# `docker compose logs`.
#
# Prerequisites (see README):
#   1. keys/private.pem + keys/public.pem generated (openssl genrsa ...),
#      readable by the container's non-root user (chmod 644 if needed).
#   2. A .env file in this directory with at least JWT_REFRESH_SECRET,
#      RESEND_API_KEY (and RESEND_FROM if you verified a domain) — compose
#      reads .env automatically for the ${VAR} substitutions below.
#
# Usage:
#   docker compose up --build
#   docker compose logs -f api
#   docker compose run --rm api ./createclient create -name "my-app"
#   docker compose down               # add -v to also wipe all data volumes
#
# Once it's up:
#   API:        http://localhost:8080
#   Prometheus: http://localhost:9090
#   Loki:       http://localhost:3100  (no UI of its own — query it through Grafana)
#   Grafana:    http://localhost:3000  (admin/admin — anonymous viewer access
#               is also enabled, so opening it needs no login at all; both
#               the Prometheus and Loki datasources are pre-provisioned,
#               nothing to click through to wire up)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth2fa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies every migrations/*.sql against `postgres`, then exits.
  # `api` waits for this to finish successfully before it starts.
  migrate:
    build: .
    command: ["./migrate"]
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/auth2fa?sslmode=disable
      # cmd/migrate calls the same config.Load() as cmd/api, which requires
      # JWT_REFRESH_SECRET to be set even though migrate itself never uses
      # it (it only applies .sql files) — has to be here or config.Load()
      # fails before migrate ever touches Postgres.
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"

      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/auth2fa?sslmode=disable
      REDIS_URL: redis://redis:6379/0

      # keys/ is bind-mounted below (it's gitignored, generated locally
      # per the README) rather than baked into the image. Alternative for
      # a filesystem-less setup: set JWT_PRIVATE_KEY_PEM_BASE64 instead —
      # same variable this project's own config.go supports for exactly
      # that case.
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_KEY_ID: auth-2fa-api-1
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 168h

      OTP_LENGTH: "6"
      OTP_TTL: 5m
      OTP_MAX_TRIES: "5"

      PASSWORD_RESET_TTL: 1h
      PASSWORD_RESET_CODE_LENGTH: "6"
      PASSWORD_RESET_MAX_TRIES: "5"

      EMAIL_VERIFICATION_TTL: 24h
      EMAIL_VERIFICATION_CODE_LENGTH: "6"
      EMAIL_VERIFICATION_MAX_TRIES: "5"

      CHANGE_EMAIL_TTL: 1h
      CHANGE_EMAIL_CODE_LENGTH: "6"
      CHANGE_EMAIL_MAX_TRIES: "5"

      # Optional, deployment-wide fallback for the change-email panel link
      # — see .env.example. Left unset, a tenant with no panel_base_url of
      # its own just gets the email without a link.
      PANEL_BASE_URL: ${PANEL_BASE_URL:-}

      # Optional — networks trusted to supply the real client IP via
      # X-Forwarded-For (e.g. a proxying backend of your own on this same
      # Docker network). See .env.example. Left unset, X-Forwarded-For is
      # never consulted.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}

      # Optional — derives the short "reference" code GET /system-admin/
      # blacklist shows instead of the real banned IP. See .env.example.
      # Left unset, the field is simply omitted.
      BAN_REFERENCE_SECRET: ${BAN_REFERENCE_SECRET:-}

      LOGIN_MAX_FAILED_ATTEMPTS: "10"
      LOGIN_LOCKOUT_WINDOW: 15m

      DEVICE_TRUST_TTL: 720h

      PIN_MAX_FAILED_ATTEMPTS: "5"
      PIN_LOCK_MINUTES: "15"
      LOGIN_PIN_TTL: 5m

      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM:-onboarding@resend.dev}

      # Standard OTel SDK env var — internal/telemetry.Setup reads it via
      # os.Getenv only to decide whether to enable export at all; the SDK
      # itself (otlpmetrichttp.New) reads this same variable again
      # internally to build the request. Per the OTel spec it MUST include
      # the scheme (http:// here — that alone is what tells the SDK to
      # skip TLS) — a bare "host:port" makes the SDK's own env parsing
      # treat the whole value as a path instead of a host, corrupting the
      # final request URL. See telemetry.Setup's doc comment for the
      # actual failure mode this caused.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

      # Optional — leaves /admin/* unregistered entirely if unset in your
      # .env. Set it there to provision api_clients over HTTP instead of
      # `docker compose run --rm api ./createclient ...`.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}

      # Optional — leaves /auth/totp/* unregistered entirely if unset. Set
      # TOTP_ENCRYPTION_KEY in your .env to enable the authenticator-app
      # second factor (see .env.example for how to generate one).
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      TOTP_ISSUER: ${TOTP_ISSUER:-auth-2fa-api}

      # Optional — leaves /auth/devices/{id}/push, /auth/login/push-status
      # and /auth/login/push-answer unregistered entirely if unset. Set
      # FIREBASE_CREDENTIALS_PATH in your .env to enable push-notification
      # login approval; the service account JSON itself goes in keys/ (same
      # ./keys bind mount as the JWT keys above), e.g.
      # FIREBASE_CREDENTIALS_PATH=/app/keys/firebase-service-account.json.
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      PUSH_LOGIN_TTL: ${PUSH_LOGIN_TTL:-60s}
      PUSH_MAX_REQUESTS: ${PUSH_MAX_REQUESTS:-5}
      PUSH_REQUEST_WINDOW: ${PUSH_REQUEST_WINDOW:-15m}
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Receives metrics over OTLP from `api` and re-exposes them in
  # Prometheus's scrape format — the API never talks to Prometheus
  # directly, and doesn't need to know it exists.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318" # OTLP/HTTP — only exposed on the host for manual poking; api reaches it over the compose network regardless.

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  # Receives logs over OTLP from the collector (native OTLP ingestion,
  # Loki 3.x+ — no Promtail/agent needed, the API pushes logs itself the
  # same way it pushes metrics).
  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100" # only for manual poking; otel-collector reaches it over the compose network regardless.

  grafana:
    # NOTE for local `docker compose up`: this bind mount works fine here.
    # It does NOT work on the production Dokploy deploy — relative
    # bind-mount paths aren't honored there (same root cause as the
    # earlier Firebase-credentials incident). Production's actual grafana
    # service is a hand-maintained "Raw" Docker Compose file pasted
    # directly into Dokploy's own UI, using top-level `configs:` with
    # inline `content:` instead of a bind mount — completely disconnected
    # from this file. Any change to grafana/provisioning/ made here has to
    # be manually re-pasted into that Dokploy compose to reach prod, with
    # every literal `$` escaped as `$$` (Compose interpolates the whole
    # file, including config content, and Grafana's own `$__range` etc.
    # look like undefined Compose vars to it) — and the config's name has
    # to be bumped (e.g. `_v3` -> `_v4`) on every content change, since
    # Compose caches a `configs:` entry by name and won't pick up new
    # content under an unchanged name even on redeploy/restart/rebuild.
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Convenience for local dev only — lets you open the dashboards
      # without logging in at all; admin/admin still works for editing.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
