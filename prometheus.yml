# Prometheus scrape config — one target: the OTel Collector's Prometheus
# exporter (see otel-collector-config.yaml), which is what actually holds
# the API's metrics. Prometheus never talks to the API directly.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
