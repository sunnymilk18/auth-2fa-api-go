# OpenTelemetry Collector config — receives metrics AND logs over OTLP
# from the API (internal/telemetry.SetupMetrics / SetupLogging).
# Metrics: re-exposed in Prometheus's scrape format (pull-based).
# Logs: pushed onward to Loki's native OTLP ingestion endpoint.
# No traces yet.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  # Pull-based: Prometheus scrapes this collector at :8889/metrics (see
  # prometheus.yml) rather than the collector pushing anywhere.
  prometheus:
    endpoint: 0.0.0.0:8889

  # Push-based, unlike metrics: Loki 3.x accepts OTLP logs natively at
  # /otlp/v1/logs, so this is just the standard OTLP/HTTP exporter aimed
  # at Loki — no separate "loki"-specific exporter needed.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
