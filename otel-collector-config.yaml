# OpenTelemetry Collector config — receives metrics over OTLP from the API
# (internal/telemetry.Setup), re-exposes them in Prometheus's scrape
# format. Nothing else: no traces/logs pipeline, matching the API's
# metrics-only instrumentation for now.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  # Pull-based: Prometheus scrapes this collector at :8889/metrics (see
  # prometheus.yml) rather than the collector pushing anywhere.
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
