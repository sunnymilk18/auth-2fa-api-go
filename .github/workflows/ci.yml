name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # CI-only, ephemeral instance — not a real secret, but still has to
      # satisfy SQL Server's password policy (8+ chars, 3 of 4 character
      # classes) or the container refuses to start.
      MSSQL_SA_PASSWORD: CIonlyPassw0rd2026

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        # Wait for SQL Server to actually accept connections before any step
        # tries to use it — the container starts before it's ready to serve.
        # mssql-tools18's sqlcmd ships inside the image itself for exactly
        # this purpose, so this needs nothing installed on the runner.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -No -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Create test database
        # Unlike Postgres's image (POSTGRES_DB), the mssql-server image has
        # no "create this database on startup" option — this creates it by
        # hand, via the driver the app itself already depends on (no
        # sqlcmd/apt install needed on the runner). Written and run from a
        # throwaway directory inside the checkout so it participates in the
        # module's already-resolved go.sum, then deleted before the Build
        # step so it never becomes part of `go build ./...`.
        run: |
          mkdir -p _ci_create_testdb
          cat > _ci_create_testdb/main.go <<'EOF'
          package main

          import (
          	"database/sql"
          	"fmt"
          	"log"
          	"os"

          	_ "github.com/microsoft/go-mssqldb"
          )

          func main() {
          	dsn := fmt.Sprintf("sqlserver://sa:%s@localhost:1433", os.Getenv("MSSQL_SA_PASSWORD"))
          	db, err := sql.Open("sqlserver", dsn)
          	if err != nil {
          		log.Fatal(err)
          	}
          	defer db.Close()
          	if _, err := db.Exec("CREATE DATABASE auth2fa_test"); err != nil {
          		log.Fatal(err)
          	}
          }
          EOF
          go run ./_ci_create_testdb
          rm -rf _ci_create_testdb

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # No Redis service needed — Redis-backed tests spin up their own
        # in-memory miniredis. SQL-Server-backed tests use this job's
        # service container; anything that can't reach it skips itself
        # rather than failing (see internal/testutil.MSSQLPool), so this
        # also covers contributors running the suite without SQL Server
        # available. Migrations apply automatically against the freshly
        # created (empty) database — no separate migrate step needed.
        env:
          TEST_MSSQL_DSN: "sqlserver://sa:${{ env.MSSQL_SA_PASSWORD }}@localhost:1433?database=auth2fa_test"
        run: go test ./... -v -count=1
