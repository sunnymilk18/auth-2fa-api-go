# Tells Grafana to auto-load every .json dashboard in this same folder on
# startup — same idea as the datasources provider, one less thing to
# click through in the UI.
apiVersion: 1

providers:
  - name: auth-2fa-api
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
