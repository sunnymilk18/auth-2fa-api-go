# Auto-provisions the Prometheus datasource on Grafana startup — nothing
# to click through in the UI, it's just there the first time you open it.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Fixed on purpose (not auto-generated) — the provisioned dashboard in
    # ./dashboards references this UID directly.
    uid: prometheus-ds
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
