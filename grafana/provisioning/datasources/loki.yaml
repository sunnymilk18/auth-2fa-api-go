# Auto-provisions the Loki datasource on Grafana startup — same idea as
# datasources/prometheus.yaml, one file per datasource.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    # Fixed on purpose (not auto-generated) — the provisioned dashboard in
    # ./dashboards references this UID directly.
    uid: loki-ds
    access: proxy
    url: http://loki:3100
    editable: true
