openapi: 3.0.3
info:
  title: auth-2fa-api
  description: |
    API independiente de autenticación con doble factor por correo (2FA).
    Flujo: registro (email + password + username + rut) → verificación de
    correo (obligatoria, o /auth/login responde 403) → login (identifier +
    password, donde identifier acepta email, username o rut indistintamente)
    → código OTP enviado por email → verificación del código → tokens JWT
    (access + refresh).

    Los access tokens se firman con RS256. Cualquier sistema que reciba un
    token de un cliente puede verificarlo por su cuenta usando la clave
    pública publicada en `/.well-known/jwks.json`, sin necesidad de llamar
    de vuelta a esta API.

    Además de ese flujo, un dispositivo puede quedar marcado como "de
    confianza": tras un login completo, se registra con un PIN de 6 dígitos
    y, en aperturas posteriores de la app en el mismo dispositivo, puede
    reautenticarse con `device_id` + `device_token` + `pin`, sin repetir
    password ni código por correo.

    **Multi-tenant**: cada sistema consumidor (app móvil, web, etc.) tiene su
    propia API key, obtenida con `cmd/createclient`, y debe enviarla en el
    header `X-API-Key` en cada llamada a `/auth/*`. Los usuarios quedan
    aislados por sistema — el mismo email, username o rut puede existir como
    cuentas distintas bajo dos API keys diferentes.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Desarrollo local
  - url: https://tu-dominio-de-produccion.example.com
    description: Producción — reemplazar por la URL real del despliegue

tags:
  - name: auth
    description: Registro, login de dos factores y gestión de tokens
  - name: devices
    description: Dispositivos de confianza + PIN — opcional, un atajo alrededor de password+OTP, no un paso requerido del flujo
  - name: totp
    description: >
      Verificación por app autenticadora (Google Authenticator, Authy, etc.)
      — alternativa opcional al código por correo, activada por cada cuenta.
      Solo existe si el servidor tiene TOTP_ENCRYPTION_KEY configurada.
  - name: push
    description: >
      Aprobación de login por notificación push — tercer método opcional,
      además de correo y TOTP: un login en un dispositivo se confirma con un
      tap en un celular ya emparejado, en vez de tipear un código. Vía
      Firebase Cloud Messaging (solo Android por ahora). Solo existe si el
      servidor tiene FIREBASE_CREDENTIALS_PATH configurada, y solo se ofrece
      a cuentas que ya tienen un dispositivo emparejado con push habilitado
      (nunca en el primer login de una cuenta).
  - name: user
    description: Datos del usuario autenticado
  - name: system
    description: Endpoints de infraestructura (salud, claves públicas)

paths:
  /health:
    get:
      tags: [system]
      summary: Estado del servicio
      responses:
        "200":
          description: El servicio está operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /.well-known/jwks.json:
    get:
      tags: [system]
      summary: Claves públicas para verificar access tokens (JWKS)
      description: >
        Cualquier sistema puede consultar este endpoint (idealmente cacheando
        el resultado, pero refrescándolo cada tanto — no solo una vez) para
        verificar la firma RS256 de un access token sin llamar de vuelta a
        esta API. Normalmente devuelve una sola clave, pero durante una
        rotación de claves puede devolver dos a la vez — elegí la que
        corresponda al `kid` del header del JWT que estás verificando, nunca
        asumas que hay una sola ni tomes la primera del array.
      responses:
        "200":
          description: Conjunto de claves públicas en formato JWKS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"

  /auth/register:
    post:
      tags: [auth]
      summary: Registrar un nuevo usuario
      description: >
        La cuenta se crea de inmediato, pero no puede loguear todavía: este
        endpoint también envía un código de verificación por correo, que hay
        que confirmar en /auth/verify-email/confirm antes de que
        /auth/login funcione. Registrarse de nuevo con un correo que
        todavía no se verificó reclama esa cuenta (contraseña nueva) en
        vez de fallar con 409 — solo una cuenta ya verificada bloquea el
        duplicado.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: >
            Solicitud inválida — email vacío o con formato inválido, password
            muy corto, username ausente/muy corto/muy largo/con forma de
            rut/con "@", o rut ausente/con dígito verificador inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            El email, el username o el rut ya están registrados. Si es el
            username, el mensaje de error incluye una alternativa libre
            sugerida (ej. "el usuario 'juan.perez' ya está en uso, probá
            con 'juan.perez2'") — email y rut no se sugieren, porque no
            tiene sentido inventarle a alguien un email o un documento de
            identidad distinto al que puso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Demasiados registros desde esta IP, intenta más tarde
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [auth]
      summary: Paso 1 del login - Verifica identifier/password y envía el código OTP por correo
      description: >
        `identifier` acepta el email, el username o el rut de la cuenta —
        ver `LoginRequest.identifier`. Si es el primer login de la cuenta
        (y el servidor tiene TOTP_ENCRYPTION_KEY configurada), no manda
        ningún código todavía — la respuesta trae `needs_2fa_setup: true`
        en su lugar, ver `LoginResponse` y las rutas `/auth/login/send-email-code`
        y `/auth/totp/enroll`/`confirm` (con `login_token`). Si la cuenta
        además tiene un dispositivo con push habilitado (nunca junto con
        `needs_2fa_setup: true`), la respuesta también trae
        `push_approval_offered: true` — ver el tag `push`.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: >
            Credenciales válidas. `needs_2fa_setup` indica si el código ya
            se mandó por correo (false, caso normal) o si falta que el
            cliente elija un método por primera vez (true).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Identifier (email, username o rut) o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Contraseña correcta, pero el correo todavía no fue verificado —
            confirmarlo en /auth/verify-email/confirm antes de loguear.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: >
            Demasiadas solicitudes — por IP (límite general de este
            endpoint) o por cuenta (demasiadas contraseñas incorrectas
            seguidas contra este email, incluso desde IPs distintas).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/verify-otp:
    post:
      tags: [auth]
      summary: Paso 2 del login - Verifica el código OTP y emite los tokens JWT
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOTPRequest"
      responses:
        "200":
          description: Código válido, tokens emitidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Código inválido o sesión de login expirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Demasiados intentos fallidos, se debe reiniciar el login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login/send-email-code:
    post:
      tags: [totp]
      summary: "Elige \"correo\" en la pantalla de primer login"
      description: >
        Solo aplica cuando /auth/login devolvió needs_2fa_setup: true. Manda
        el código OTP por correo bajo el mismo login_token — de ahí en más
        el flujo sigue normal con /auth/verify-otp, sin un login_token
        distinto.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_token]
              properties:
                login_token:
                  type: string
      responses:
        "200":
          description: Código enviado por correo
        "401":
          description: login_token inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La verificación por app autenticadora no está habilitada en este servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Emite un nuevo par de tokens a partir de un refresh token válido
      description: Rota el refresh token (el anterior queda revocado).
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Nuevo par de tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Refresh token inválido, expirado o revocado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoca un refresh token
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Token revocado

  /auth/password-reset/request:
    post:
      tags: [auth]
      summary: Solicita un correo con un código para restablecer la contraseña
      description: >
        Responde igual (200) exista o no una cuenta con ese correo, para no
        filtrar qué correos están registrados. Si existe, se envía un correo
        con un código de un solo uso.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestRequest"
      responses:
        "200":
          description: Solicitud procesada (independientemente de si el correo existe)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: Consume el código de restablecimiento y establece una nueva contraseña
      description: >
        El código es de un solo uso. Al confirmarse, se revocan todas las
        sesiones (refresh tokens) y todos los dispositivos de confianza
        (PIN) del usuario, forzando a iniciar sesión de nuevo en todos lados.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Contraseña actualizada
        "400":
          description: Cuerpo de la solicitud inválido, o la nueva contraseña tiene menos de 8 caracteres
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Código inválido, o no hay un restablecimiento pendiente para ese correo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Demasiados intentos con códigos incorrectos — hay que solicitar uno nuevo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/verify-email/confirm:
    post:
      tags: [auth]
      summary: Confirma el código de verificación enviado al registrarse
      description: >
        El código es de un solo uso, con límite de intentos. Al confirmarse,
        desbloquea /auth/login para esa cuenta.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailConfirmRequest"
      responses:
        "204":
          description: Correo verificado
        "400":
          description: Cuerpo de la solicitud inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Código inválido, o no hay una verificación pendiente para ese correo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Demasiados intentos con códigos incorrectos — hay que solicitar uno nuevo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/verify-email/resend:
    post:
      tags: [auth]
      summary: Reenvía el código de verificación
      description: >
        Genera y envía un código nuevo, invalidando cualquiera pendiente —
        para cuando el primer correo se perdió o el código expiró.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendEmailVerificationRequest"
      responses:
        "200":
          description: Código reenviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Cuerpo de la solicitud inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No existe una cuenta con ese correo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ese correo ya está verificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/devices/register:
    post:
      tags: [devices]
      summary: Marca el dispositivo actual como de confianza
      description: >
        Requiere haber completado el login completo (password + OTP) justo
        antes — se llama con el access_token recién obtenido. Genera un PIN
        y un device_token nuevos para este device_id (si ya existía, los
        reemplaza).
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "201":
          description: Dispositivo registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDeviceResponse"
        "400":
          description: PIN inválido (debe ser exactamente 6 dígitos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token faltante, inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/devices/login:
    post:
      tags: [devices]
      summary: Login con dispositivo de confianza + PIN (sin password ni OTP)
      description: >
        Un dispositivo no registrado (device_id desconocido) siempre falla
        aquí — debe usar /auth/login primero. El device_token se rota en
        cada uso exitoso: la respuesta trae uno nuevo que reemplaza al
        anterior.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLoginRequest"
      responses:
        "200":
          description: PIN válido, tokens emitidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginResponse"
        "401":
          description: Dispositivo no confiable, expirado, revocado, o PIN incorrecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Demasiados intentos de PIN fallidos — el dispositivo quedó revocado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/devices:
    get:
      tags: [devices]
      summary: Lista los dispositivos de confianza del usuario autenticado
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: Lista de dispositivos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"

  /auth/devices/{id}:
    delete:
      tags: [devices]
      summary: Revoca un dispositivo de confianza
      security:
        - apiKeyAuth: []
          bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Dispositivo revocado
        "404":
          description: Dispositivo no encontrado (o no pertenece a este usuario)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/totp/enroll:
    post:
      tags: [totp]
      summary: Inicia la activación de una app autenticadora para la cuenta
      description: >
        Identifica la cuenta de UNA de estas dos formas — nunca hace falta
        pasar ambas: `Authorization: Bearer <access_token>` (cambiando de
        método más adelante, ya logueado) o `login_token` en el body (la
        pantalla de elección del primer login — ver `/auth/login`, todavía
        no existe ningún access_token en ese momento). Genera un secreto
        nuevo y devuelve la URL otpauth:// para renderizar como código QR —
        todavía no queda activo hasta confirmarlo con /auth/totp/confirm.
      security:
        - apiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                login_token:
                  type: string
                  description: Solo para la pantalla de elección del primer login — omitir cuando se usa Authorization Bearer.
      responses:
        "200":
          description: Secreto generado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollResponse"
        "401":
          description: Ni un Bearer válido ni un login_token válido fueron provistos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La verificación por app autenticadora no está habilitada en este servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/totp/confirm:
    post:
      tags: [totp]
      summary: Confirma la activación de la app autenticadora
      description: >
        Recibe el código que la app ya está mostrando tras escanear el QR de
        /auth/totp/enroll — misma identificación dual que enroll (Bearer o
        login_token). Si coincide, activa la app como segundo factor.
        Con Bearer (cambiando de método, ya logueado): responde 204, sin
        tokens. Con login_token (primer login): responde 200 con
        access_token + refresh_token directo — activar TOTP completa el
        login en el mismo paso, no hace falta pasar por /auth/verify-otp.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPConfirmRequest"
      responses:
        "200":
          description: "Código válido, vía login_token (primer login): login completado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "204":
          description: "Código válido, vía Authorization Bearer: app autenticadora activada"
        "400":
          description: Falta el código
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Código inválido, o ni un Bearer válido ni un login_token válido fueron provistos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/totp/disable:
    post:
      tags: [totp]
      summary: Desactiva la app autenticadora
      description: >
        El login de la cuenta vuelve a usar el código por correo. No pide el
        código de la app para desactivarla — alcanza con una sesión ya
        autenticada, mismo criterio que revocar un dispositivo de confianza.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "204":
          description: App autenticadora desactivada
        "401":
          description: Token faltante, inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/devices/{id}/push:
    post:
      tags: [push]
      summary: Habilita la aprobación por notificación push en un dispositivo de confianza
      description: >
        El `id` es el de `trusted_devices` (ver GET /auth/devices), no el
        device_id que el cliente genera — por eso push piggybackea sobre un
        dispositivo YA registrado como confiable (POST /auth/devices/register)
        en vez de ser un emparejamiento separado: hay que haber activado el
        PIN de acceso rápido en este dispositivo antes de poder habilitar
        push en él. push_token es el token FCM que el SDK de Firebase entrega
        en el celular.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnablePushRequest"
      responses:
        "204":
          description: Push habilitado en el dispositivo
        "400":
          description: push_token faltante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token faltante, inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            La aprobación push no está habilitada en este servidor, o el
            dispositivo no existe (o no pertenece a este usuario)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [push]
      summary: Desactiva la aprobación por notificación push en un dispositivo
      description: >
        La contraparte de "apagar" de POST en esta misma ruta — borra el
        token FCM guardado. El dispositivo en sí (PIN, confianza) no se
        toca, a diferencia de DELETE /auth/devices/{id} (que revoca el
        dispositivo entero); esto solo apaga push, dejando el acceso
        rápido con PIN intacto.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Push desactivado en el dispositivo
        "401":
          description: Token faltante, inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            La aprobación push no está habilitada en este servidor, o el
            dispositivo no existe (o no pertenece a este usuario)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login/push-status:
    get:
      tags: [push]
      summary: Consulta el estado de una solicitud de aprobación push pendiente
      description: >
        Pensado para polling (~cada 2s) desde el dispositivo que está
        logueando, mientras el celular no respondió — mismo patrón que el
        Device Authorization Grant de OAuth 2.0 (RFC 8628) para "esperar a
        que un humano actúe en otro dispositivo". En `status: approved` la
        respuesta también trae un par de tokens directo y la solicitud
        queda consumida — un poll después de eso devuelve 401, igual que
        reusar un código OTP ya verificado.
      security:
        - apiKeyAuth: []
      parameters:
        - name: login_token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Estado actual de la solicitud
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushStatusResponse"
        "400":
          description: login_token faltante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >
            La solicitud no existe, ya fue consumida, o expiró
            (PUSH_LOGIN_TTL, 60s por default) — el cliente debe dejar de
            hacer polling y seguir con el código por correo, que sigue
            vigente por su propia ventana (OTP_TTL, independiente de esta)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La aprobación push no está habilitada en este servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login/push-answer:
    post:
      tags: [push]
      summary: Registra la respuesta del celular a una solicitud de aprobación
      description: >
        Se llama con el Authorization Bearer del CELULAR (la cuenta ya
        autenticada que recibió la notificación), nunca con el login_token
        del dispositivo que está logueando — un celular solo puede
        responder solicitudes dirigidas a su propia cuenta.
        chosen_number es el número de 2 dígitos que el usuario tocó, de los
        tres que le llegaron con la notificación (uno correcto, dos
        señuelos, ya mezclados por el servidor). Un número equivocado
        rechaza la sesión de forma PERMANENTE y sin reintentos — no hay
        forma de volver a intentar con el número correcto después de fallar
        una vez, misma mitigación anti-"MFA fatigue" que Microsoft
        Authenticator agregó tras ataques reales de bombardeo de
        notificaciones.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushAnswerRequest"
      responses:
        "200":
          description: Respuesta registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushAnswerResponse"
        "400":
          description: login_token faltante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >
            Token faltante/inválido, o la solicitud no existe/expiró/ya fue
            respondida, o pertenece a otra cuenta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La aprobación push no está habilitada en este servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login/request-email-code:
    post:
      tags: [push]
      summary: >
        Pide el código por correo para un login que solo ofreció push
        ("usar otro método")
      description: >
        Solo aplica cuando /auth/login devolvió push_approval_offered:
        true — en ese caso el código NO se manda por correo automáticamente
        (a diferencia del caso sin push, donde sí). Llamar acá lo manda
        recién en este momento, bajo el mismo login_token — de ahí en más
        el flujo sigue normal con /auth/verify-otp, sin un login_token
        distinto. Se puede llamar más de una vez (reenviar código), cada
        llamada invalida el código anterior.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_token]
              properties:
                login_token:
                  type: string
      responses:
        "200":
          description: Código enviado por correo
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: login_token faltante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: La sesión de login no existe o expiró
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La aprobación push no está habilitada en este servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login/resend-code:
    post:
      tags: [auth]
      summary: Reenvía el código para un login normal por correo ("no recibí el código")
      description: >
        Solo aplica al login normal sin push (el caso donde /auth/login ya
        mandó el código automáticamente). Vuelve a mandarlo bajo el mismo
        login_token, invalidando el código anterior — misma idea que
        /auth/login/request-email-code, pero sin requerir una sesión de
        push: siempre disponible, incluso con push deshabilitado en el
        servidor. No aplica a cuentas con app autenticadora (TOTP), cuyo
        login_token no tiene sesión de OTP asociada.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_token]
              properties:
                login_token:
                  type: string
      responses:
        "200":
          description: Código enviado por correo
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: login_token faltante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: La sesión de login no existe o expiró
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La cuenta usa app autenticadora (TOTP), no hay código emailado que reenviar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me:
    get:
      tags: [user]
      summary: Datos del usuario autenticado (ejemplo de ruta protegida)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datos del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Token faltante, inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token JWT (RS256), obtenido tras completar el login de dos
        factores. Enviar como `Authorization: Bearer <access_token>`.

    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Identifica al sistema consumidor (tenant). Se genera con
        `cmd/createclient` o `POST /admin/clients` y se envía en todo
        request a `/auth/*`.


        **No la incluyas en código que corre en el dispositivo del
        usuario final** (JavaScript de navegador, una app móvil) — es un
        secreto de servidor, no algo que deba ser públicamente
        extraíble. El patrón correcto: tu propio backend llama a esta
        API con la key; tu frontend/app le habla a tu backend, nunca
        directo acá.

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, username, rut]
      properties:
        email:
          type: string
          format: email
          description: >
            Formato validado en el servidor (un solo "@", dominio con
            punto, sin espacios) — no alcanza con que no esté vacío.
        password:
          type: string
          format: password
          minLength: 8
        username:
          type: string
          minLength: 8
          maxLength: 32
          description: >
            No tiene que ser único entre personas distintas — muchas cuentas
            pueden compartir el mismo nombre elegido (ver `rut` para el
            identificador que sí es único de verdad). Sí es único dentro de
            este sistema (tenant): si ya está tomado, el registro falla con
            409 sugiriendo una alternativa libre (ej. "juan.perez2"). No
            puede tener forma de RUT (ni siquiera con puntos/guiones — ej.
            "1234.5678" también se rechaza) ni contener "@" — eso evita que
            se confunda con un RUT o un email, respectivamente, al loguear
            (ver `LoginRequest.identifier`).
          example: juan.perez
        rut:
          type: string
          description: >
            Documento de identidad chileno — único por sistema (tenant),
            validado con el dígito verificador módulo 11. Acepta cualquier
            formato de entrada ("12.345.678-5", "12345678-5", "123456785");
            se normaliza igual sea cual sea el que se use.
          example: "12.345.678-5"

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: >
            Acepta el email, el username o el rut de la cuenta — el backend
            prueba las tres columnas en una sola consulta
            (email = ? OR username = ? OR rut = ?), sin adivinar antes cuál
            es cuál. No hay que ofrecer un selector de "con qué querés
            loguear" en el cliente: un solo campo alcanza para los tres.
          example: juan.perez
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        login_token:
          type: string
          description: >
            Si needs_2fa_setup es false: presentar junto al código OTP en
            /auth/verify-otp. Si es true: pasar a /auth/login/send-email-code
            o a /auth/totp/enroll (login_token en el body) según lo que
            elija el usuario.
        message:
          type: string
          example: verification code sent to email
        needs_2fa_setup:
          type: boolean
          description: >
            true solo en el primer login de la cuenta (y solo si el
            servidor tiene TOTP configurada) — el cliente debe mostrar la
            elección de método en vez de pedir un código.
        push_approval_offered:
          type: boolean
          description: >
            true si la cuenta tiene un dispositivo con aprobación push
            habilitada — el cliente puede hacer polling de
            GET /auth/login/push-status con este mismo login_token. A
            diferencia de TOTP, el código NO se manda por correo todavía en
            este caso — mismo criterio que sistemas como Microsoft
            Authenticator o Duo: push es el desafío por defecto, el correo
            es un respaldo bajo demanda. Si la persona no puede usar push,
            el cliente llama a POST /auth/login/request-email-code con este
            mismo login_token para pedirlo recién ahí. Siempre false junto
            con needs_2fa_setup: true, y siempre false si el servidor no
            tiene FIREBASE_CREDENTIALS_PATH configurada.

    VerifyOTPRequest:
      type: object
      required: [login_token, code]
      properties:
        login_token:
          type: string
        code:
          type: string
          example: "123456"

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    PasswordResetRequestRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirmRequest:
      type: object
      required: [email, code, new_password]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: Código numérico recibido por correo (un solo uso, con límite de intentos)
        new_password:
          type: string
          format: password
          minLength: 8

    VerifyEmailConfirmRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: Código numérico recibido por correo al registrarse (un solo uso, con límite de intentos)

    ResendEmailVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT firmado con RS256, verificable con la clave pública de /.well-known/jwks.json.
        refresh_token:
          type: string
          description: JWT firmado con HS256, de uso exclusivo con /auth/refresh y /auth/logout.
        token_type:
          type: string
          example: Bearer

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        rut:
          type: string
        totp_enabled:
          type: boolean
          description: >
            Si la cuenta activó la app autenticadora (TOTP) como su segundo
            factor. Siempre presente, incluso cuando el servidor no tiene
            TOTP_ENCRYPTION_KEY configurada (en ese caso, siempre false).

    JWKS:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty:
                type: string
                example: RSA
              use:
                type: string
                example: sig
              kid:
                type: string
                description: >
                  Identifica esta clave puntual — matchealo contra el `kid`
                  del header del JWT que estás verificando. Normalmente hay
                  un solo elemento en `keys`, pero durante una rotación de
                  claves puede haber dos.
              alg:
                type: string
                example: RS256
              n:
                type: string
                description: Módulo RSA, codificado en base64url.
              e:
                type: string
                description: Exponente público RSA, codificado en base64url.

    RegisterDeviceRequest:
      type: object
      required: [device_id, pin]
      properties:
        device_id:
          type: string
          description: Identificador único generado por la app una sola vez y guardado en almacenamiento seguro del dispositivo.
        device_name:
          type: string
          example: "iPhone de Juan"
        pin:
          type: string
          description: Exactamente 6 dígitos.
          example: "123456"

    RegisterDeviceResponse:
      type: object
      properties:
        device_token:
          type: string
          description: Token de posesión del dispositivo. Se muestra una sola vez — guardarlo en almacenamiento seguro local.

    DeviceLoginRequest:
      type: object
      required: [device_id, device_token, pin]
      properties:
        device_id:
          type: string
        device_token:
          type: string
        pin:
          type: string
          example: "123456"

    TOTPEnrollResponse:
      type: object
      properties:
        otpauth_url:
          type: string
          description: >
            URL otpauth://totp/... con el secreto embebido — renderizar como
            código QR (o mostrar como texto para carga manual en la app).
          example: "otpauth://totp/auth-2fa-api:user@example.com?secret=JBSWY3DPEHPK3PXP&issuer=auth-2fa-api"

    TOTPConfirmRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Código de 6 dígitos mostrado por la app autenticadora.
          example: "123456"
        login_token:
          type: string
          description: Solo para la pantalla de elección del primer login — omitir cuando se usa Authorization Bearer.

    DeviceLoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        device_token:
          type: string
          description: Token rotado — reemplaza al anterior en el almacenamiento local del cliente.
        token_type:
          type: string
          example: Bearer

    DeviceInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        device_name:
          type: string
        push_enabled:
          type: boolean
          description: >
            Si este dispositivo tiene la aprobación por notificación push
            habilitada — estado real del servidor, no algo que el cliente
            deba cachear localmente.
        trusted_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    DeviceListResponse:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceInfo"

    EnablePushRequest:
      type: object
      required: [push_token]
      properties:
        push_token:
          type: string
          description: Token de registro FCM que el SDK de Firebase entrega en el celular.

    PushStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        number:
          type: integer
          description: >
            El número de 2 dígitos (0-99) que hay que mostrarle a la persona
            para que lo compare contra los tres que le llegaron al celular —
            sin esto, no hay nada contra qué comparar. Presente siempre,
            no solo en "pending".
          example: 42
        access_token:
          type: string
          description: Solo presente cuando status es "approved".
        refresh_token:
          type: string
          description: Solo presente cuando status es "approved".
        token_type:
          type: string
          example: Bearer
          description: Solo presente cuando status es "approved".

    PushAnswerRequest:
      type: object
      required: [login_token, chosen_number]
      properties:
        login_token:
          type: string
          description: El login_token de la solicitud que llegó en la notificación (request_id en el payload de datos FCM), no el de la propia sesión del celular.
        chosen_number:
          type: integer
          description: El número de 2 dígitos que el usuario tocó, de los tres que le llegaron con la notificación.
          example: 42

    PushAnswerResponse:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected]

    Error:
      type: object
      properties:
        error:
          type: string
