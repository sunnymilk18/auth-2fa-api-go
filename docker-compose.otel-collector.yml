# Standalone compose — solo el OTel Collector, para pegar tal cual en
# Dokploy como su propio proyecto Compose (sin repo de por medio). El
# contenido de otel-collector-config.yaml va EMBEBIDO acá abajo, en el
# bloque `configs:` con `content:` inline — Docker Compose crea el archivo
# él solo dentro del contenedor, no hace falta ningún archivo externo ni
# bind mount. (Requiere Docker Compose v2.23+ / Compose Spec reciente —
# lo normal en cualquier Dokploy actualizado.)
#
# Expone:
#   4318 -> receptor OTLP/HTTP — la API apunta su OTEL_EXPORTER_OTLP_ENDPOINT
#           acá (mismo proyecto: "otel-collector:4318" por nombre de
#           servicio; proyecto separado: la dirección/dominio que Dokploy
#           le asigne a este servicio).
#   8889 -> exportador Prometheus — lo que Prometheus scrapea
#           (<este-servicio>:8889 como target).
#
# IMPORTANTE — reemplazá LOKI_URL_AQUI más abajo (dos veces: una en el
# exporter, otra en el comentario) por la URL real de tu Loki en Dokploy,
# una vez que lo tengas desplegado (ver docker-compose.loki.yml). Al
# revés que con Prometheus (que scrapea AL collector), acá es el collector
# el que empuja hacia Loki — necesita saber su dirección de antemano.
#
# En producción, si API/Loki y este collector terminan en el MISMO
# proyecto de Dokploy, usá los nombres de servicio directo (api,
# otel-collector, loki) en vez de dominios, y sacá los `ports:` de abajo
# — se resuelven por nombre de servicio en la red interna sin necesidad
# de publicarlos al host/internet.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    configs:
      - source: otel_collector_config
        target: /etc/otel-collector-config.yaml
    ports:
      - "4318:4318"
      - "8889:8889"
    restart: unless-stopped

configs:
  otel_collector_config:
    content: |
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
            grpc:
              endpoint: 0.0.0.0:4317

      processors:
        batch: {}

      exporters:
        prometheus:
          endpoint: 0.0.0.0:8889

        # https:// + la URL de dominio de tu Loki en Dokploy (sin :puerto
        # — Traefik ya resuelve el puerto interno correcto a través del
        # dominio, igual que con Prometheus/otel-collector). Si Loki
        # queda en este mismo proyecto, usá "http://loki:3100/otlp" en
        # cambio.
        otlphttp/loki:
          endpoint: https://LOKI_URL_AQUI

      service:
        pipelines:
          metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [prometheus]
          logs:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp/loki]
